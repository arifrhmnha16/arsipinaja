<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="#2563EB"/>
  
  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="#171717" stroke-width="12" fill="none"/>

  <!-- Scaled Archive Dossier Vault -->
  <g transform="translate(64, 74) scale(10.66)">

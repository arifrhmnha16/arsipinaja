    <circle cx="8.5" cy="24.25" r="1" fill="#38BDF8" stroke="#171717" stroke-width="0.8" />
    <circle cx="27.5" cy="24.25" r="1" fill="#38BDF8" stroke="#171717" stroke-width="0.8" />

